    <main class="container py-5">

        <h1 class="text-center titulo-seccion">
            Contáctame
        </h1>

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card shadow animar">

                    <div class="card-body p-4 p-md-5">

                        <h3 class="card-title mb-4">
                            Formulario de contacto
                        </h3>

                        <form id="formularioContacto" novalidate>

                            <!-- NOMBRE -->

                            <div class="mb-3">

                                <label
                                    for="nombre"
                                    class="form-label">

                                    Nombre completo

                                </label>

                                <input
                                    type="text"
                                    id="nombre"
                                    class="form-control"
                                    placeholder="Escribe tu nombre">

                                <div
                                    id="errorNombre"
                                    class="text-danger mt-1">
                                </div>

                            </div>


                            <!-- CORREO -->

                            <div class="mb-3">

                                <label
                                    for="correo"
                                    class="form-label">

                                    Correo electrónico

                                </label>

                                <input
                                    type="email"
                                    id="correo"
                                    class="form-control"
                                    placeholder="ejemplo@correo.com">

                                <div
                                    id="errorCorreo"
                                    class="text-danger mt-1">
                                </div>

                            </div>


                            <!-- TELÉFONO -->

                            <div class="mb-3">

                                <label
                                    for="telefono"
                                    class="form-label">

                                    Teléfono

                                </label>

                                <input
                                    type="text"
                                    id="telefono"
                                    class="form-control"
                                    placeholder="Número de teléfono">

                                <div
                                    id="errorTelefono"
                                    class="text-danger mt-1">
                                </div>

                            </div>


                            <!-- ASUNTO -->

                            <div class="mb-3">

                                <label
                                    for="asunto"
                                    class="form-label">

                                    Asunto

                                </label>

                                <input
                                    type="text"
                                    id="asunto"
                                    class="form-control"
                                    placeholder="Asunto del mensaje">

                                <div
                                    id="errorAsunto"
                                    class="text-danger mt-1">
                                </div>

                            </div>


                            <!-- MENSAJE -->

                            <div class="mb-4">

                                <label
                                    for="mensaje"
                                    class="form-label">

                                    Mensaje

                                </label>

                                <textarea
                                    id="mensaje"
                                    class="form-control"
                                    rows="5"
                                    placeholder="Escribe tu mensaje"></textarea>

                                <div
                                    id="errorMensaje"
                                    class="text-danger mt-1">
                                </div>

                            </div>


                            <!-- BOTÓN -->

                            <button
                                type="submit"
                                class="btn btn-principal w-100">

                                Enviar mensaje

                            </button>

                        </form>


                        <!-- MENSAJE DE ÉXITO -->

                        <div
                            id="mensajeExito"
                            class="alert alert-success mt-4"
                            style="display: none;">

                            El formulario fue validado correctamente.

                        </div>

                    </div>

                </div>

            </div>

        </div>
